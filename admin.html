<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - TrackMyGTS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self';
                 style-src 'self';
                 img-src 'self' data:;
                 font-src 'self';">
  <link rel="stylesheet" href="styles.css">
  <script defer src="admin.js"></script>
</head>
<body>
  <header class="site-header">
    <h1>Admin Dashboard</h1>
  </header>

  <main class="dashboard-content">
    <section class="panel">
      <h2>Update Parcel Status</h2>
      <form id="updateForm" class="tracking-form">
        <input type="text" id="trackingCode" placeholder="Tracking number" required>
        <input type="text" id="status" placeholder="Status" required>
        <input type="text" id="location" placeholder="Location" required>
        <textarea id="details" placeholder="Details"></textarea>
        <input type="password" id="adminKey" placeholder="Admin key" required>
        <button type="submit">Update</button>
      </form>
      <div id="updateResult" class="panel" style="margin-top:1rem;"></div>
    </section>
  </main>
</body>
</html>
